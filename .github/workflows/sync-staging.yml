name: Sync Test mit Prod

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          repository: AxCooking/AxCooking
          token: ${{ secrets.SYNC_TOKEN }}
          path: prod

      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          repository: AxCooking/AxCooking-Test
          token: ${{ secrets.SYNC_TOKEN }}
          path: test

      - name: Sync index.html (unveraendert - identisch mit PROD)
        run: cp prod/index.html test/index.html

      - name: Sync 404.html (unveraendert - identisch mit PROD)
        run: cp prod/404.html test/404.html

      - name: config.js fuer TEST schreiben (einzige Anpassung)
        run: |
          cat > test/config.js << 'CONFIG'
          const GH_OWNER = 'AxCooking';
          const GH_REPO = 'AxCooking-Test';
          const GH_BRANCH = 'main';
          const GH_API = 'https://api.github.com';
                              const GH_PUBLIC_TOKEN = null;
          CONFIG

      - name: Sync logos Ordner
        run: |
          rm -rf test/logos
          mkdir -p test/logos
          cp -r prod/logos/. test/logos/

      - name: Sync data Ordner
        run: |
          rm -rf test/data
          mkdir -p test/data
          cp -r prod/data/. test/data/

      - name: Sync images Ordner
        run: |
          rm -rf test/images
          mkdir -p test/images
          cp -r prod/images/. test/images/

      - name: Sync recipes Ordner (falls vorhanden)
        run: |
          rm -rf test/recipes
          if [ -d prod/recipes ]; then
            mkdir -p test/recipes
            cp -r prod/recipes/. test/recipes/
          fi

      - name: Sync recipes-en Ordner (falls vorhanden)
        run: |
          rm -rf test/recipes-en
          if [ -d prod/recipes-en ]; then
            mkdir -p test/recipes-en
            cp -r prod/recipes-en/. test/recipes-en/
          fi

      - name: Sync sitemap.xml und robots.txt
        run: |
          if [ -f prod/sitemap.xml ]; then cp prod/sitemap.xml test/sitemap.xml; fi
          if [ -f prod/robots.txt ]; then cp prod/robots.txt test/robots.txt; fi

      - name: Sync favicon.ico und apple-touch-icon.png (Root-Kopien)
        run: |
          if [ -f prod/favicon.ico ]; then cp prod/favicon.ico test/favicon.ico; fi
          if [ -f prod/apple-touch-icon.png ]; then cp prod/apple-touch-icon.png test/apple-touch-icon.png; fi

      - name: Sync scripts Ordner (Image-Pipeline-Skripte)
        run: |
          rm -rf test/scripts
          if [ -d prod/scripts ]; then
            mkdir -p test/scripts
            cp -r prod/scripts/. test/scripts/
          fi

      - name: Sync package.json und package-lock.json
        run: |
          if [ -f prod/package.json ]; then cp prod/package.json test/package.json; fi
          if [ -f prod/package-lock.json ]; then cp prod/package-lock.json test/package-lock.json; fi

      - name: Sync sw.js (PWA Service Worker)
        run: |
          if [ -f prod/sw.js ]; then cp prod/sw.js test/sw.js; fi

      - name: Sync manifest.webmanifest (PWA Manifest)
        run: |
          if [ -f prod/manifest.webmanifest ]; then cp prod/manifest.webmanifest test/manifest.webmanifest; fi

      - name: Test-Banner erstellen
        run: |
          cat > test/test-banner.html << 'BANNER'
          <div style="background:#c0392b;color:#fff;text-align:center;padding:8px 16px;font-family:sans-serif;font-size:13px;font-weight:600;letter-spacing:0.5px;position:relative;z-index:9999;">
            TEST-UMGEBUNG - Aenderungen hier betreffen nur das Testsystem
          </div>
          BANNER

      - name: Commit und Push zu TEST
        run: |
          cd test
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync PROD zu TEST $(date '+%Y-%m-%d %H:%M')"
          git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/AxCooking/AxCooking-Test.git main
