name: Sync Test mit Prod

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          repository: AxCooking/AxCooking
          token: ${{ secrets.SYNC_TOKEN }}
          path: prod

      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          repository: AxCooking/AxCooking-Test
          token: ${{ secrets.SYNC_TOKEN }}
          path: test

      - name: Sync index.html PROD zu TEST
        run: |
          python3 - <<'PYEOF'
          with open('prod/index.html', 'r') as f:
              c = f.read()
          c = c.replace("GH_REPO='AxCooking'", "GH_REPO='AxCooking-Test'")
          c = c.replace('href="/logos/', 'href="logos/')
          c = c.replace('src="/logos/', 'src="logos/')
          with open('test/index.html', 'w') as f:
              f.write(c)
          print('index.html angepasst')
          PYEOF

      - name: Sync logos Ordner
        run: |
          rm -rf test/logos
          mkdir -p test/logos
          cp -r prod/logos/. test/logos/

      - name: Sync data Ordner
        run: |
          rm -rf test/data
          mkdir -p test/data
          cp -r prod/data/. test/data/

      - name: Commit und Push zu TEST
        run: |
          cd test
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync PROD zu TEST $(date '+%Y-%m-%d %H:%M')"
          git push https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/AxCooking/AxCooking-Test.git main
